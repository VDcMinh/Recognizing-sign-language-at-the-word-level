experiment:
  name: sel31-test1
  seed: 42
  output_root: outputs/skeleton
  monitor_metric: val/top1
  monitor_mode: max
  save_every_epoch: false

dataset:
  name: WLASL
  subset: nslt100
  data_root: data/datasets/WLASL/branch_inputs/skeleton/rtmw_l
  keypoint_set: selected_31
  num_classes: 100
  expected_shape: [3, 150, 31, 1]
  manifests:
    train: data/datasets/WLASL/branch_inputs/skeleton/rtmw_l/manifests/nslt100_selected_31_train.csv
    val: data/datasets/WLASL/branch_inputs/skeleton/rtmw_l/manifests/nslt100_selected_31_val.csv
    test: data/datasets/WLASL/branch_inputs/skeleton/rtmw_l/manifests/nslt100_selected_31_test.csv
  return_metadata: true
  strict_shape_check: true

dataloader:
  batch_size: 16
  num_workers: 2
  pin_memory: true
  shuffle_train: true

graph:
  layout: selected_31
  strategy: spatial
  add_self_links: true
  normalize_adjacency: true

model:
  name: simple_stgcn
  in_channels: 3
  num_nodes: 31
  num_classes: 100
  hidden_channels: 64
  dropout: 0.5

train:
  epochs: 30
  device: auto
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0005
  loss: cross_entropy
  grad_clip_norm: null
  amp: false

scheduler:
  enabled: false
  name: cosine
  min_lr: 0.000001

logging:
  use_wandb: true
  entity_env: WANDB_ENTITY
  project: wlasl-skeleton
  run_name: sel31-test1
  tags:
    - nslt100
    - selected_31
    - baseline
    - cross_entropy
  log_model: true
