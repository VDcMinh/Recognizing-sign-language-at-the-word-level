run:
  name: fullbbox_i3d_nslt100_ce
  output_dir: outputs/appearance/fullbbox_i3d_nslt100_ce
  seed: 42
  monitor_metric: val_top5
  monitor_mode: max

data:
  package_root: packaging_outputs/fullbbox_i3d/nslt100/wlasl-nslt100-fullbbox-i3d
  train_manifest: manifests/nslt100_train.csv
  val_manifest: manifests/nslt100_val.csv
  test_manifest: manifests/nslt100_test.csv
  clip_len: 32
  input_size: 224
  num_workers: 2
  pin_memory: true
  sampling_strategy: auto

model:
  name: fullbbox_i3d
  in_channels: 3
  num_classes: 100
  dropout: 0.5
  feature_dim: 1024
  pretrained_path: null
  freeze_backbone: false
  return_features: false

preprocessing:
  resize_mode: letterbox
  pad_value: 0
  mean: [0.45, 0.45, 0.45]
  std: [0.225, 0.225, 0.225]
  train_augmentation:
    color_jitter:
      enabled: true
      brightness: 0.1
      contrast: 0.1
      saturation: 0.1
      probability: 0.8
    horizontal_flip: false
    horizontal_flip_prob: 0.5

training:
  epochs: 50
  batch_size: 2
  gradient_accumulation_steps: 1
  amp: true
  device: auto
  resume_checkpoint: null
  monitor_metric: val_top5
  save_best: true
  grad_clip_norm: null
  eval_split: test
  loss:
    name: cross_entropy
  label_smoothing: {}
  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 0.01
    momentum: 0.9
    nesterov: true
  scheduler:
    enabled: true
    name: cosine
    min_lr: 0.000001
    step_size: 10
    gamma: 0.1
  early_stopping:
    enabled: true
    monitor: val_top5
    mode: max
    patience: 10
    min_delta: 0.0

eval:
  topk: [1, 5]

wandb:
  enabled: false
  project: wlasl-appearance-i3d
  entity_env: WANDB_ENTITY
  run_name: fullbbox_i3d_nslt100_ce
  tags:
    - appearance
    - fullbbox
    - i3d-style
    - nslt100
  log_model: true
