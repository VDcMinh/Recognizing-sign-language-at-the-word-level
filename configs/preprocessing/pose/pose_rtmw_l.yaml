dataset:
  name: WLASL
  root: data/datasets/WLASL

input:
  subset: nslt100
  splits:
    - train
    - val
    - test
  standardized_manifests_root: data/datasets/WLASL/standardized/manifests
  manifest_filenames:
    train: nslt100_train.csv
    val: nslt100_val.csv
    test: nslt100_test.csv
  input_source: frames
  require_standardized_status_ok: true

output:
  root: data/datasets/WLASL/pose/rtmw_l
  keypoints_root: data/datasets/WLASL/pose/rtmw_l/wholebody_133
  manifests_root: data/datasets/WLASL/pose/rtmw_l/manifests
  reports_root: data/datasets/WLASL/pose/rtmw_l/reports
  logs_root: data/datasets/WLASL/pose/rtmw_l/logs

pose:
  backend: rtmw_l
  keypoint_layout: wholebody_133
  num_keypoints: 133
  input_width: 288
  input_height: 384
  device: cuda:0
  fallback_device: cpu
  batch_size: 1
  save_visualizations: false
  overwrite: true

mmpose:
  config_file: checkpoints/pose/rtmw_l/rtmw-l_8xb320-270e_cocktail14-384x288.py
  checkpoint_file: checkpoints/pose/rtmw_l/rtmw-dw-x-l_simcc-cocktail14_270e-384x288-20231122.pth
  detector_config_file: null
  detector_checkpoint_file: null
  use_detector: false

quality:
  min_mean_confidence: 0.10
  missing_keypoint_confidence_threshold: 0.01
  min_valid_frames_ratio: 0.50
  important_regions:
    - body
    - face
    - left_hand
    - right_hand
