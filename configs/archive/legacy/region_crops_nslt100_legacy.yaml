dataset:
  name: WLASL
  root: data/datasets/WLASL
  subset: nslt100

input:
  splits:
    - train
    - val
    - test
  pose_backend: rtmw_l
  pose_layout: wholebody_133
  standardized_frames_root: data/datasets/WLASL/standardized/frames
  standardized_manifests_root: data/datasets/WLASL/standardized/manifests
  pose_root: data/datasets/WLASL/pose/rtmw_l/nslt100/wholebody_133
  pose_backend_root: data/datasets/WLASL/pose/rtmw_l
  pose_manifest_root: data/datasets/WLASL/pose/rtmw_l/nslt100/manifests
  require_standardized_status_ok: true
  require_pose_status_ok: true

output:
  root: data/datasets/WLASL/branch_inputs/regions/rtmw_l
  regions:
    - left_hand
    - right_hand
    - face

crop:
  clip_length: 64
  crop_size: 112
  confidence_threshold: 0.2
  face_margin: 1.45
  face_fallback_margin: 2.2
  hand_margin: 1.7
  min_face_points: 8
  min_face_anchor_points: 2
  min_hand_points: 2

preview:
  frame_indices:
    - 0
    - 15
    - 31
    - 47
    - 63

options:
  overwrite: true
  save_crops: true
  save_tensors: true
  save_previews: true

quality:
  low_valid_ratio_threshold: 0.5
  high_black_crop_ratio_threshold: 0.3
