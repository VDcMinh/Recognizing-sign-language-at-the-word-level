experiment:
  name: nslt300-sel31-stgcnpp-ce-lr0005-bs16-wd0005-ep240-v1
  seed: 42
  output_root: outputs/skeleton
  monitor_metric: val/top1
  monitor_mode: max
  save_every_epoch: false
  output_dir: outputs/skeleton/nslt300-sel31-stgcnpp-ce-lr0005-bs16-wd0005-ep240-v1
dataset:
  name: WLASL
  subset: nslt300
  data_root: data/datasets/WLASL/branch_inputs/skeleton/rtmw_l
  keypoint_set: selected_31
  num_classes: 300
  expected_shape:
  - 3
  - 150
  - 31
  - 1
  manifests:
    train: data/datasets/WLASL/branch_inputs/skeleton/rtmw_l/manifests/nslt300_selected_31_train.csv
    val: data/datasets/WLASL/branch_inputs/skeleton/rtmw_l/manifests/nslt300_selected_31_val.csv
    test: data/datasets/WLASL/branch_inputs/skeleton/rtmw_l/manifests/nslt300_selected_31_test.csv
    all: data/datasets/WLASL/branch_inputs/skeleton/rtmw_l/manifests/nslt300_selected_31_all.csv
  return_metadata: true
  strict_shape_check: true
dataloader:
  batch_size: 16
  num_workers: 2
  pin_memory: true
  shuffle_train: true
graph:
  layout: selected_31
  strategy: spatial
  add_self_links: true
  normalize_adjacency: true
model:
  name: stgcnpp
  in_channels: 3
  num_nodes: 31
  num_classes: 300
  base_channels: 64
  dropout: 0.5
  hidden_channels: 64
  stage_channels:
  - 64
  - 64
  - 64
  - 128
  - 128
  - 256
  temporal_strides:
  - 1
  - 1
  - 1
  - 2
  - 1
  - 2
train:
  epochs: 240
  device: auto
  optimizer: sgd
  learning_rate: 0.05
  momentum: 0.9
  weight_decay: 0.001
  loss: cross_entropy
  grad_clip_norm: null
  amp: false
scheduler:
  enabled: true
  name: cosine
  min_lr: 1.0e-06
logging:
  use_wandb: true
  entity_env: WANDB_ENTITY
  project: wlasl-skeleton-300
  run_name: nslt300-sel31-stgcnpp-ce-lr0005-bs16-wd0005-ep240-v1
  tags:
  - nslt300
  - selected_31
  - stgcnpp
  - cross_entropy
  log_model: true
  entity: vuducminh474-hanoi-university-of-science-and-technology
config_path: configs/train/skeleton_selected_31_nslt300_stgcnpp.yaml
project_root: /kaggle/working/Recognizing-sign-language-at-the-word-level
runtime:
  limit_train: null
  limit_val: null
  limit_test: null
  loss_type: cross_entropy
  label_smoothing_epsilon: 0.0
