experiment:
  name: regions-resnet18-gru-nslt1000-ce-ce-lr1e-4-wd1e-3-ready
  output_dir: /kaggle/working/outputs/regions/regions-resnet18-gru-nslt1000-ce-ce-lr1e-4-wd1e-3-ready
  seed: 42
  save_every_epoch: false
  output_root: /kaggle/working/outputs/regions
  monitor_metric: val/top5
  monitor_mode: max
dataset:
  name: WLASL
  subset: nslt1000
  num_classes: 1000
  data_root: /kaggle/working/regions_nslt1000_runtime
  manifests:
    train: /kaggle/working/regions_nslt1000_runtime/manifests/nslt1000_train.csv
    val: /kaggle/working/regions_nslt1000_runtime/manifests/nslt1000_val.csv
    test: /kaggle/working/regions_nslt1000_runtime/manifests/nslt1000_test.csv
  expected_shape:
  - 3
  - 3
  - 64
  - 112
  - 112
  region_order:
  - left_hand
  - right_hand
  - face
  active_regions:
  - left_hand
  - right_hand
  - face
  normalize:
    type: imagenet
  return_metadata: true
  strict_shape_check: true
model:
  name: region_resnet18_gru
  backbone: resnet18
  num_classes: 1000
  num_regions: 3
  in_channels: 3
  clip_len: 64
  crop_size: 112
  pretrained: true
  freeze_encoder: true
  encoder_name: resnet18
  encoder_feature_dim: 512
  gru_hidden_size: 128
  gru_num_layers: 1
  bidirectional: true
  dropout: 0.5
  fusion: concat
  use_valid_mask: true
  cnn_feature_dim: 256
train:
  epochs: 50
  batch_size: 8
  num_workers: 2
  pin_memory: true
  shuffle_train: true
  device: cuda
  loss: cross_entropy
  amp: false
  grad_clip_norm: 1.0
  save_best_metric: val_top5
  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 0.001
    learning_rate: 0.0001
  scheduler:
    enabled: true
    name: cosine
    min_lr: 1.0e-06
early_stopping:
  enabled: false
  monitor: val_top5
  mode: max
  patience: 10
  min_delta: 0.0
  monitor_metric: val/top5
  monitor_mode: max
augmentation:
  enabled: false
  color_jitter:
    enabled: false
    brightness: 0.2
    contrast: 0.2
    saturation: 0.15
    hue: 0.05
  random_resized_crop:
    enabled: false
    scale:
    - 0.85
    - 1.0
  random_erasing:
    enabled: false
    p: 0.15
  temporal_dropout:
    enabled: false
    p: 0.1
  region_dropout:
    enabled: false
    p: 0.1
logging:
  use_wandb: true
  entity: vuducminh474-hanoi-university-of-science-and-technology
  entity_env: WANDB_ENTITY
  project: wlasl-region-1000
  run_name: regions-resnet18-gru-nslt1000-ce-ce-lr1e-4-wd1e-3-ready
  tags:
  - nslt1000
  - regions
  - incremental
  - kaggle
  - resnet18
  - gru
  - left-hand
  - right-hand
  - face
  - all-regions
  - nslt300-reuse
  log_model: true
dataloader:
  batch_size: 8
config_path: /kaggle/working/generated_configs/regions_resnet18_gru_nslt1000_ce_kaggle_run.yaml
project_root: /kaggle/working/Recognizing-sign-language-at-the-word-level
runtime:
  limit_train: null
  limit_val: null
  limit_test: null
  loss_type: cross_entropy
  label_smoothing_epsilon: 0.0
